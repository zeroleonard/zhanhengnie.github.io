<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#315E8A"/>
  <!--
    Unified NZH monogram — single glyph, shared strokes:
    N = left vertical + diagonal + right vertical
    H = left vertical + crossbar + right vertical
    Z = top-right cap + diagonal + bottom-left cap (stylized)
  -->
  <!-- Left vertical (shared: N, H) -->
  <line x1="15" y1="12" x2="15" y2="52" stroke="#F6F8F7" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right vertical (shared: N, H) -->
  <line x1="49" y1="12" x2="49" y2="52" stroke="#F6F8F7" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Diagonal (shared: N, Z) from top-left to bottom-right -->
  <line x1="15" y1="12" x2="49" y2="52" stroke="#F6F8F7" stroke-width="4.5" stroke-linecap="round"/>
  <!-- H crossbar -->
  <line x1="15" y1="32" x2="49" y2="32" stroke="#F6F8F7" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Z top cap: short horizontal at top-right -->
  <line x1="32" y1="12" x2="49" y2="12" stroke="#F6F8F7" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Z bottom cap: short horizontal at bottom-left -->
  <line x1="15" y1="52" x2="32" y2="52" stroke="#F6F8F7" stroke-width="4.5" stroke-linecap="round"/>
</svg>
